name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Our own checker: frontmatter, name == folder, placeholders, secrets.
      - run: npm run validate
      # Anthropic's parser, on the skills and on the manifests.
      - run: npx -y @anthropic-ai/claude-code plugin validate --strict skills
      - run: npx -y @anthropic-ai/claude-code plugin validate --strict .
      # Version agreement between plugin.json, marketplace.json and SKILL.md.
      - run: node scripts/validate-skills.mjs --check-versions
      - run: node scripts/tests/check-versions.test.mjs
      - run: node scripts/sync-backlog.mjs --selftest
      - run: node scripts/sync-backlog.mjs --check
      # Every bundled checker must prove it can go red on a known-bad input.
      - run: node skills/power-platform/scripts/lint-flows.mjs --selftest
      - run: node skills/power-platform/scripts/check-canvas-format.mjs --selftest
      - run: node skills/power-platform/scripts/check-canvas-overlap.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/check-pa-yaml.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/check-standards.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/preflight.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/lib.mjs --selftest
      - run: python skills/power-platform/scripts/inspect-artifact.py --selftest
      - run: python skills/power-platform/scripts/check-drift.py --selftest
      - run: python skills/power-platform/scripts/deploy-tables.py --selftest
      - run: python skills/power-platform/scripts/ship-canvas.py --selftest
      - run: node --check skills/power-platform/scripts/canvas-browser.mjs
      - run: python skills/power-platform/scripts/canvas-mcp.py --selftest
      - run: python skills/power-platform/scripts/check-published-order.py --selftest
      - run: python skills/power-platform/scripts/flow-runs.py --selftest
      - run: python skills/power-platform/scripts/audit-pages-permissions.py --selftest
      - run: python skills/power-platform/scripts/seed-data.py --selftest
      - run: python skills/power-platform/scripts/deploy-flows.py --selftest
      - run: python skills/power-platform/scripts/fabric.py --selftest
      - run: python skills/power-platform/scripts/reconcile-report.py --selftest
      - run: python skills/power-platform/scripts/pbi-theme.py --selftest
      - run: node skills/power-platform/scripts/check-all.mjs --selftest
      - run: node skills/power-platform/scripts/contract-to-walk.mjs --selftest
      - run: node skills/power-platform/scripts/setup-harness.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/shared-guard.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/audit-stop.mjs --selftest
      - run: node skills/power-platform/scripts/hooks/plugin-gate.mjs --selftest
      - run: node skills/power-platform/scripts/canvas-browser.mjs --selftest
      - run: pip install python-docx pillow
      - run: python skills/power-platform/assets/doc-kit/doc_kit.py --selftest
      # The site walker's selftest has a browser half: a real Chromium against a local fixture site.
      # Kept last so node_modules does not exist while the repository checks above run.
      - run: node skills/power-platform/scripts/site-walk.mjs --selftest --logic-only
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node skills/power-platform/scripts/site-walk.mjs --selftest --channel chromium
