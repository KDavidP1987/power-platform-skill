<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">SkillEra Skills</title>
  <desc id="d">Open-source Agent Skills from SkillEra. A strip of fifteen squares stands for the fifteen consideration layers the dod skill scores; fourteen are filled, one is open.</desc>
  <rect width="1200" height="300" fill="#22262B"/>
  <!-- paper margin line, like a ruled sheet -->
  <line x1="72" y1="0" x2="72" y2="300" stroke="#F2EFE9" stroke-opacity="0.12" stroke-width="1"/>
  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#F2EFE9">
    <text x="96" y="118" font-size="56" font-weight="700" letter-spacing="-1.5">SkillEra <tspan font-weight="400">Skills</tspan></text>
    <text x="96" y="160" font-size="20" font-weight="400" fill="#F2EFE9" fill-opacity="0.78">Open-source Agent Skills for Claude Code, Codex, Cursor — and any agent that reads SKILL.md</text>
  </g>
  <!-- the fifteen-layer strip: the artifact the dod skill produces -->
  <g transform="translate(96 208)">
    <g fill="#2E7D6B">
      <rect x="0" y="0" width="40" height="40" rx="3"/>
      <rect x="48" y="0" width="40" height="40" rx="3"/>
      <rect x="96" y="0" width="40" height="40" rx="3"/>
      <rect x="144" y="0" width="40" height="40" rx="3"/>
      <rect x="192" y="0" width="40" height="40" rx="3"/>
      <rect x="240" y="0" width="40" height="40" rx="3"/>
      <rect x="288" y="0" width="40" height="40" rx="3"/>
      <rect x="336" y="0" width="40" height="40" rx="3"/>
      <rect x="384" y="0" width="40" height="40" rx="3"/>
      <rect x="432" y="0" width="40" height="40" rx="3"/>
    </g>
    <!-- one layer marked Gap in amber: the honest state a plan is allowed to have -->
    <rect x="480" y="0" width="40" height="40" rx="3" fill="none" stroke="#E8A13F" stroke-width="2.5"/>
    <g fill="#2E7D6B">
      <rect x="528" y="0" width="40" height="40" rx="3"/>
      <rect x="576" y="0" width="40" height="40" rx="3"/>
      <rect x="624" y="0" width="40" height="40" rx="3"/>
      <rect x="672" y="0" width="40" height="40" rx="3"/>
    </g>
    <text x="736" y="27" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="17" fill="#F2EFE9" fill-opacity="0.78">LoadFromYaml true · PASS</text>
  </g>
  <!-- publisher -->
  <text x="1104" y="118" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EFE9" fill-opacity="0.55">skillera.io</text>
</svg>
